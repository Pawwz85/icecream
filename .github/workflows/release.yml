name: Release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            generator: Ninja
            package_generator: ZIP
            platform_suffix: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            generator: Ninja
            package_generator: TGZ
            platform_suffix: linux-x64
          - name: macOS arm64
            os: macos-14
            generator: Ninja
            package_generator: TGZ
            platform_suffix: macos-arm64
          - name: macOS x64
            os: macos-13
            generator: Ninja
            package_generator: TGZ
            platform_suffix: macos-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DCPACK_GENERATOR=${{ matrix.package_generator }}
          -DCPACK_PACKAGE_FILE_NAME=icecream-${{ github.ref_name }}-${{ matrix.platform_suffix }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cmake --build build --target package --config Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: icecream-${{ github.ref_name }}-${{ matrix.platform_suffix }}
          path: build/icecream-${{ github.ref_name }}-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true